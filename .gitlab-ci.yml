default:
  image: "registry.gitlab.com/tnl-project/container-images/archlinux-tnl-cuda:latest"
  before_script:
    # make sure that $PATH and other essential variables are set correctly
    - source /etc/profile

stages:
  - build

build_Release:
  stage: build
  script:
    - cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release
    - cmake --build build

build_Debug:
  stage: build
  script:
    - cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug
    - cmake --build build
